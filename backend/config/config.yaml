app:
  name: "Issue Whisperer"
  version: "0.1.0"
  log_level: "INFO"

server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"

llm:
  provider: "ollama"        # Options: ollama, openrouter, openai_compatible
  model: "gemma3:4b"
  base_url: "http://localhost:11434"
  api_key: null             # Not needed for Ollama
  temperature: 0.2
  max_tokens: 2048
  timeout: 120

embeddings:
  model: "all-MiniLM-L6-v2"  # Sentence-transformers, lightweight for RTX 2050
  device: "cpu"              # Default to "cpu" for broad out-of-the-box compatibility
  batch_size: 32

retrieval:
  top_k: 3
  similarity_threshold: 0.3

github:
  base_url: "https://api.github.com"
  cache_dir: "data/cache"
  use_cache: true

data:
  cache_dir: "data/cache"
  index_dir: "data/index"

trajectories:
  dir: "trajectories"
  enabled: true

paths:
  outputs: "outputs"

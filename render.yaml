services:
  - type: web
    name: issue-whisperer-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: google/gemini-2.0-flash-exp:free
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
